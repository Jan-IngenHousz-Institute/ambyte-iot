schema: jii.ambyte-schedule/v1-draft
id: urn:jii:schedule:default-multichannel
version: 0.1.0-draft
name: default-multichannel
description: SS every minute, spectra and MPF by day, with traces around sunrise and sunset.

# Site facts such as location, timezone, deployment, and MAC live in NVS.
# This schedule is identical across sites.

protocols:
  SS:
    # 45 pulses since #47; 59 seconds left no slack on a one-minute grid.
    - pulses: 45
      freq: 1
      actinic: 0

  MPF:
    # Dark baseline.
    - pulses: 40
      freq: 10
      actinic: 0

    # Saturating phases. Actinic values are raw DAC values.
    - pulses: 70
      freq: 100
      actinic: -250
    - pulses: 10
      freq: 100
      actinic: -200
    - pulses: 10
      freq: 100
      actinic: -160
    - pulses: 10
      freq: 100
      actinic: -250

    # Relaxation.
    - pulses: 40
      freq: 10
      actinic: 0

jobs:
  steady_state:
    # Conventional five-field cron is the normal scheduling syntax.
    schedule:
      cron: "* * * * *"
    steps:
      - uses: ambit/trace
        with:
          protocol: SS
          hold_window: false

  spectra:
    schedule:
      cron: "*/5 * * * *"
    when:
      window: day
    steps:
      # With no channels list, every AMBIT that answers a ping is measured.
      - uses: ambit/spectrum

  saturating_flash:
    schedule:
      cron: "*/10 * * * *"
    when:
      window: day
    steps:
      - uses: ambit/trace
        with:
          protocol: MPF
          hold_window: true

  dark_edge:
    # Solar entries are the explicit extension for times cron cannot know.
    schedule:
      - solar: sunset
        offset: +30m
      - solar: sunrise
        offset: -30m
    steps:
      - uses: ambit/trace
        with:
          protocol: MPF
          hold_window: true
          tag: edge

  health:
    schedule:
      - boot
      - solar: sunrise
        offset: -15m
      - solar: sunset
        offset: +15m
    steps:
      - uses: device/status-report
