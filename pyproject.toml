[project]
name = "ambyte-iot-ludo"
version = "0.1.0"
description = "Ambyte IoT firmware (ESP32-S3) + BLE provisioning helper"
# Covers the host-side Python only; the firmware and hardware design under
# components/, main/, and schedule/ stay CERN-OHL-S-2.0. See README.md.
license = "GPL-3.0-only"
authors = [
    { name = "dominikvrbic", email = "dominik.vrbic@jii.org" }
]
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.0.1",
    "cryptography>=46.0.7",
    "paho-mqtt>=2.1.0",
    "protobuf>=7.34.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
pythonpath = [".", "tests"]

[tool.coverage.run]
branch = true
source = ["tools", "flash_gui"]
omit = ["flash_gui/tests/*", "flash_gui/tz_zone_table.py", "*/vendor/*"]
relative_files = true
# Preserve first-party Python coverage from forked workers and Python CLI
# subprocesses. C harnesses still run with their own ASan/UBSan instrumentation;
# these Python reports do not claim C coverage.
concurrency = ["multiprocessing"]
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
include_namespace_packages = true
omit = ["*/vendor/*"]

[dependency-groups]
test = [
    "certifi>=2024.7.4",
    "esptool>=5.0",
    "littlefs-python>=0.19",
    "pyserial>=3.5",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "tzlocal>=5.0",
]
