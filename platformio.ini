; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main
default_envs = esp32-s3-devkitm-1

[env:esp32-s3-devkitm-1] 
platform = espressif32@6.12.0
board = esp32-s3-devkitm-1
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
monitor_speed = 115200
monitor_filters = send_on_enter
extra_scripts =
    pre:tools/extra_script.py
    ; superseded: the NVS image now embeds `flash_time` (build_nvs_image.py) and
    ; the firmware bootstraps the RTC from it at boot — no serial hook needed.
    ; post:tools/set_rtc_on_upload.py

[env:bench]
extends = env:esp32-s3-devkitm-1
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bench.defaults"

[env:bench-spiram-internal]
extends = env:bench
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bench.defaults;sdkconfig.bench.spiram-internal.defaults"

[env:bench-wifi-ps-none]
extends = env:bench
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bench.defaults;sdkconfig.bench.wifi-ps-none.defaults"

[env:bench-pm-none]
extends = env:bench
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.bench.defaults;sdkconfig.bench.pm-none.defaults"

