; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio] 
src_dir = main 

[env:esp32-s3-devkitm-1] 
platform = espressif32@6.12.0
platform_packages =
    platformio/framework-espidf@3.50500.0
    platformio/tool-esptoolpy@2.40900.250804
board = esp32-s3-devkitm-1
framework = espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
monitor_speed = 115200
monitor_filters = send_on_enter
extra_scripts =
    pre:tools/extra_script.py
    ; superseded: the NVS image now embeds `flash_time` (build_nvs_image.py) and
    ; the firmware bootstraps the RTC from it at boot — no serial hook needed.
    ; post:tools/set_rtc_on_upload.py

