name: Firmware pull request gate

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Assert exact head checkout
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "${ACTUAL_HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Expected exact PR head ${EXPECTED_HEAD_SHA}, got ${ACTUAL_HEAD_SHA}"
            exit 1
          fi
          echo "Exact PR head: ${ACTUAL_HEAD_SHA}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: tools/release-analysis/package-lock.json

      - name: Validate title with the local analyzer
        env:
          AMBYTE_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/pr_gate/validate_title.mjs

  release-candidate:
    name: Firmware release candidate
    needs: conventional-title
    if: always() && needs.conventional-title.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Assert exact head and fetch base and tags separately
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD_SHA="$(git rev-parse HEAD)"
          if [[ "${ACTUAL_HEAD_SHA}" != "${EXPECTED_HEAD_SHA}" ]]; then
            echo "::error::Expected exact PR head ${EXPECTED_HEAD_SHA}, got ${ACTUAL_HEAD_SHA}"
            exit 1
          fi

          AUTH_HEADER="basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: ${AUTH_HEADER}" \
            fetch --no-tags origin "${BASE_SHA}"
          git -c http.extraheader="AUTHORIZATION: ${AUTH_HEADER}" \
            fetch --force origin 'refs/tags/*:refs/tags/*'

          if ! git cat-file -e "${BASE_SHA}^{commit}"; then
            echo "::error::PR base ${BASE_SHA} is unavailable after the explicit fetch"
            exit 1
          fi
          echo "Exact PR head: ${ACTUAL_HEAD_SHA}"
          echo "Exact PR base: ${BASE_SHA}"

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: tools/release-analysis/package-lock.json

      - name: Install locked release-analysis dependencies
        working-directory: tools/release-analysis
        run: npm ci --ignore-scripts

      - name: Collect read-only Git and GitHub facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_GATE_TEMP="${RUNNER_TEMP}/ambyte-pr-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${PR_GATE_TEMP}"
          python3 tools/pr_gate/cli.py collect \
            --event "${GITHUB_EVENT_PATH}" \
            --repository "${GITHUB_REPOSITORY}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --runner-temp "${PR_GATE_TEMP}" \
            --api-url "${GITHUB_API_URL}" \
            --output "${PR_GATE_TEMP}/candidate-analysis-input.json"
          printf 'AMBYTE_PR_GATE_TEMP=%s\n' "${PR_GATE_TEMP}" >> "${GITHUB_ENV}"

      - name: Analyze candidate and enforce settled base
        run: |
          set -euo pipefail
          set +e
          node tools/release-analysis/src/cli.mjs analyze-candidate \
            < "${AMBYTE_PR_GATE_TEMP}/candidate-analysis-input.json" \
            > "${AMBYTE_PR_GATE_TEMP}/candidate-analysis.json"
          ANALYSIS_STATUS=$?
          set -e
          jq . "${AMBYTE_PR_GATE_TEMP}/candidate-analysis.json"
          if [[ ${ANALYSIS_STATUS} -ne 0 ]]; then
            {
              echo '## Firmware release candidate'
              echo
              echo 'Release analysis failed closed:'
              echo '```json'
              jq . "${AMBYTE_PR_GATE_TEMP}/candidate-analysis.json"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit "${ANALYSIS_STATUS}"
          fi

      - name: Prepare canonical notes and candidate metadata
        id: prepare
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 tools/pr_gate/cli.py prepare \
            --event "${GITHUB_EVENT_PATH}" \
            --analysis "${AMBYTE_PR_GATE_TEMP}/candidate-analysis.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --workflow-sha "${WORKFLOW_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --output-dir "${AMBYTE_PR_GATE_TEMP}/prepared" \
            --github-output "${GITHUB_OUTPUT}"
          cat "${AMBYTE_PR_GATE_TEMP}/prepared/preview.md" >> "${GITHUB_STEP_SUMMARY}"

      - name: Build and package the exact firmware candidate
        id: build
        uses: ./.github/actions/build-firmware-candidate
        with:
          version: ${{ steps.prepare.outputs.firmware-version }}
          metadata: ${{ steps.prepare.outputs.metadata-path }}
          release-notes: ${{ steps.prepare.outputs.notes-path }}
          output-dir: ${{ runner.temp }}/ambyte-candidate-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify deterministic artifact name
        env:
          PREPARED_ARTIFACT_NAME: ${{ steps.prepare.outputs.artifact-name }}
          PACKAGED_ARTIFACT_NAME: ${{ steps.build.outputs.artifact-name }}
        run: |
          set -euo pipefail
          if [[ "${PACKAGED_ARTIFACT_NAME}" != "${PREPARED_ARTIFACT_NAME}" ]]; then
            echo "::error::Packaged artifact name does not match prepared identity"
            exit 1
          fi

      - name: Upload the one exact candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.artifact-name }}
          path: ${{ steps.build.outputs.candidate-path }}
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Best-effort update of the PR preview comment
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_PATH: ${{ steps.prepare.outputs.summary-path }}
        run: |
          set -euo pipefail
          COMMENT_ID="$({
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- ambyte-firmware-release-candidate -->")) | .id'
          } 2>/dev/null | tail -n 1 || true)"

          if [[ -n "${COMMENT_ID}" ]]; then
            if ! gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              -F "body=@${PREVIEW_PATH}" >/dev/null; then
              echo "::warning::Read-only token could not update the firmware candidate comment"
            fi
          elif ! gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -F "body=@${PREVIEW_PATH}" >/dev/null; then
            echo "::warning::Read-only token could not create the firmware candidate comment"
          fi
