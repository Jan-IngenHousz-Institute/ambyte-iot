name: Firmware and Lua PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Preview and build release units
    needs: validate-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Test release scoping
        run: npm run test:release

      - name: Detect firmware build scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "${PR_BASE_SHA}" "${PR_HEAD_SHA}" \
            | node tools/release/pr-build-scope.js \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Compute release preview
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Present semantic-release with the PR tree as one squash commit whose
          # message is the already validated PR title.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main "${PR_HEAD_SHA}"
          git reset --soft "${PR_BASE_SHA}"
          git commit --allow-empty -m "${PR_TITLE}"

          # Match openJII's PR preview: env-ci reads these process variables.
          export GITHUB_REF="refs/heads/main"
          export GITHUB_EVENT_NAME="push"

          preview_unit() {
            local unit="$1"
            local workdir="$2"
            local log="release-preview-${unit}.log"
            set +e
            (cd "${workdir}" && "${GITHUB_WORKSPACE}/node_modules/.bin/semantic-release" --dry-run --no-ci) \
              2>&1 | tee "${log}" >&2
            local status=${PIPESTATUS[0]}
            set -e
            if [[ ${status} -ne 0 ]]; then return "${status}"; fi
            node "${GITHUB_WORKSPACE}/tools/release/next-version.js" "${log}"
          }

          FIRMWARE_VERSION=$(preview_unit firmware .)
          LUA_VERSION=$(preview_unit lua lua)
          FIRMWARE_WILL_RELEASE=false
          LUA_WILL_RELEASE=false
          if [[ -n "${FIRMWARE_VERSION}" ]]; then
            BUILD_VERSION="${FIRMWARE_VERSION}"
            ZIP_NAME="ambyte-iot-v${FIRMWARE_VERSION}.zip"
            FIRMWARE_WILL_RELEASE=true
          else
            BUILD_VERSION="pr-${PR_NUMBER}-${PR_HEAD_SHA:0:12}"
            ZIP_NAME="ambyte-iot-${BUILD_VERSION}.zip"
          fi
          if [[ -n "${LUA_VERSION}" ]]; then LUA_WILL_RELEASE=true; fi

          if [[ -n "${FIRMWARE_VERSION}" ]]; then
            LUA_BUILT_AGAINST_FW="${FIRMWARE_VERSION}"
          else
            LUA_BUILT_AGAINST_FW=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1 | sed 's/^v//')
          fi
          if [[ -z "${LUA_BUILT_AGAINST_FW}" ]]; then
            echo "::error::Cannot determine the firmware version Lua was built against"
            exit 1
          fi

          echo "firmware-build-version=${BUILD_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "firmware-version=${FIRMWARE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "firmware-will-release=${FIRMWARE_WILL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "lua-version=${LUA_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "lua-will-release=${LUA_WILL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "lua-built-against-fw=${LUA_BUILT_AGAINST_FW}" >> "${GITHUB_OUTPUT}"
          echo "zip-name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Release preview"
            echo
            if [[ "${FIRMWARE_WILL_RELEASE}" == "true" ]]; then
              echo "- Firmware: **v${FIRMWARE_VERSION}**"
            else
              echo "- Firmware: no release"
            fi
            if [[ "${LUA_WILL_RELEASE}" == "true" ]]; then
              echo "- Lua: **lua-v${LUA_VERSION}** (built against firmware ${LUA_BUILT_AGAINST_FW})"
            else
              echo "- Lua: no release"
            fi
            echo
            echo "- Title: \`${PR_TITLE}\`"
            echo "- Firmware build version: \`${BUILD_VERSION}\`"
          } | tee release-preview.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Python tooling
        run: python -m unittest discover -s tests -v

      - name: Prepare release artifact
        run: |
          mkdir -p dist
          cp release-preview.md dist/release-preview.md

      - name: Install PlatformIO
        if: steps.scope.outputs.firmware-build-required == 'true'
        run: |
          python -m venv "${RUNNER_TEMP}/platformio"
          "${RUNNER_TEMP}/platformio/bin/pip" install --disable-pip-version-check platformio==6.1.19

      - name: Build unprovisioned firmware
        if: steps.scope.outputs.firmware-build-required == 'true'
        env:
          AMBYTE_NVS_SKIP: "1"
          AMBYTE_PROJECT_VER: ${{ steps.preview.outputs.firmware-build-version }}
        run: "${RUNNER_TEMP}/platformio/bin/pio run -e esp32-s3-devkitm-1"

      - name: Verify version and create flash ZIP
        if: steps.scope.outputs.firmware-build-required == 'true'
        env:
          FIRMWARE_VERSION: ${{ steps.preview.outputs.firmware-build-version }}
          ZIP_NAME: ${{ steps.preview.outputs.zip-name }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/esp32-s3-devkitm-1"
          BUILD_FILES=(
            firmware.bin
            bootloader.bin
            partitions.bin
            ota_data_initial.bin
            flasher_args.json
          )
          for FILE in "${BUILD_FILES[@]}"; do
            test -f "${BUILD_DIR}/${FILE}"
          done
          test ! -f "${BUILD_DIR}/nvs.bin"

          "${RUNNER_TEMP}/platformio/bin/pio" pkg exec -p tool-esptoolpy -- \
            esptool.py image_info --version 2 "${BUILD_DIR}/firmware.bin" \
            | tee app-info.txt
          grep -F "App version: ${FIRMWARE_VERSION}" app-info.txt

          mkdir -p dist
          cp "${BUILD_DIR}/firmware.bin" dist/firmware.bin
          mkdir -p dist/bundle/bootloader dist/bundle/partition_table
          cp "${BUILD_DIR}/firmware.bin" dist/bundle/ambyte-iot.bin
          cp "${BUILD_DIR}/bootloader.bin" dist/bundle/bootloader/bootloader.bin
          cp "${BUILD_DIR}/partitions.bin" dist/bundle/partition_table/partition-table.bin
          cp "${BUILD_DIR}/ota_data_initial.bin" dist/bundle/ota_data_initial.bin
          cp "${BUILD_DIR}/flasher_args.json" dist/bundle/flasher_args.json
          (cd dist/bundle && zip -9 -r "../${ZIP_NAME}" .)
          rm -rf dist/bundle

      - name: Build Lua release candidate
        if: steps.preview.outputs.lua-will-release == 'true'
        env:
          LUA_VERSION: ${{ steps.preview.outputs.lua-version }}
          BUILT_AGAINST_FW: ${{ steps.preview.outputs.lua-built-against-fw }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4
          luac5.4 -p lua/main.lua
          python tools/build_lua_release.py \
            --output-dir dist \
            --version "${LUA_VERSION}" \
            --built-against-fw "${BUILT_AGAINST_FW}" \
            --repository "${REPOSITORY}"
          test "$(jq -r .script_version dist/main.lua.manifest.json)" = "${LUA_VERSION}"
          test "$(jq -r .built_against_fw dist/main.lua.manifest.json)" = "${BUILT_AGAINST_FW}"
          test "$(sha256sum dist/main.lua | awk '{print $1}')" = \
            "$(jq -r .sha256 dist/main.lua.manifest.json)"

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.event.pull_request.head.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
