name: Firmware and schedule PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Preview and build release units
    needs: validate-pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Test release scoping
        run: npm run test:release

      - name: Detect firmware build scope
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-renames --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}" \
            | node tools/release/pr-build-scope.js \
            | tee -a "${GITHUB_OUTPUT}"

      - name: Compute release preview
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Present semantic-release with the PR tree as one squash commit whose
          # message is the already validated PR title.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          PR_MERGE_BASE=$(git merge-base "${PR_BASE_SHA}" "${PR_HEAD_SHA}")
          git checkout -B main "${PR_HEAD_SHA}"
          git reset --soft "${PR_MERGE_BASE}"
          git commit --allow-empty -m "${PR_TITLE}"

          # Match openJII's PR preview: env-ci reads these process variables.
          export GITHUB_REF="refs/heads/main"
          export GITHUB_EVENT_NAME="push"

          preview_unit() {
            local unit="$1"
            local workdir="$2"
            local log="release-preview-${unit}.log"
            set +e
            (cd "${workdir}" && "${GITHUB_WORKSPACE}/node_modules/.bin/semantic-release" --dry-run --no-ci) \
              2>&1 | tee "${log}" >&2
            local status=${PIPESTATUS[0]}
            set -e
            if [[ ${status} -ne 0 ]]; then return "${status}"; fi
            node "${GITHUB_WORKSPACE}/tools/release/next-version.js" "${log}"
          }

          FIRMWARE_VERSION=$(preview_unit firmware .)
          SCHEDULE_VERSION=$(preview_unit schedule schedule)
          FIRMWARE_WILL_RELEASE=false
          SCHEDULE_WILL_RELEASE=false
          if [[ -n "${FIRMWARE_VERSION}" ]]; then
            BUILD_VERSION="${FIRMWARE_VERSION}"
            ZIP_NAME="ambyte-iot-v${FIRMWARE_VERSION}.zip"
            FIRMWARE_WILL_RELEASE=true
          else
            BUILD_VERSION="pr-${PR_NUMBER}-${PR_HEAD_SHA:0:12}"
            ZIP_NAME="ambyte-iot-${BUILD_VERSION}.zip"
          fi
          if [[ -n "${SCHEDULE_VERSION}" ]]; then SCHEDULE_WILL_RELEASE=true; fi

          if [[ -n "${FIRMWARE_VERSION}" ]]; then
            SCHEDULE_BUILT_AGAINST_FW="${FIRMWARE_VERSION}"
          else
            SCHEDULE_BUILT_AGAINST_FW=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1 | sed 's/^v//')
          fi
          if [[ -z "${SCHEDULE_BUILT_AGAINST_FW}" ]]; then
            echo "::error::Cannot determine the firmware version the schedule was built against"
            exit 1
          fi

          echo "firmware-build-version=${BUILD_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "firmware-version=${FIRMWARE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "firmware-will-release=${FIRMWARE_WILL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "schedule-version=${SCHEDULE_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "schedule-will-release=${SCHEDULE_WILL_RELEASE}" >> "${GITHUB_OUTPUT}"
          echo "schedule-built-against-fw=${SCHEDULE_BUILT_AGAINST_FW}" >> "${GITHUB_OUTPUT}"
          echo "zip-name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"
          {
            echo "## Release preview"
            echo
            if [[ "${FIRMWARE_WILL_RELEASE}" == "true" ]]; then
              echo "- Firmware: **v${FIRMWARE_VERSION}**"
            else
              echo "- Firmware: no release"
            fi
            if [[ "${SCHEDULE_WILL_RELEASE}" == "true" ]]; then
              echo "- Schedule: **schedule-v${SCHEDULE_VERSION}** (built against firmware ${SCHEDULE_BUILT_AGAINST_FW})"
            else
              echo "- Schedule: no release"
            fi
            echo
            echo "- Title: \`${PR_TITLE}\`"
            echo "- Firmware build version: \`${BUILD_VERSION}\`"
          } | tee release-preview.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python tooling dependencies
        run: python -m pip install --disable-pip-version-check -r flash_gui/requirements.txt

      - name: Install PlatformIO
        run: |
          python -m venv "${RUNNER_TEMP}/platformio"
          "${RUNNER_TEMP}/platformio/bin/pip" install --disable-pip-version-check platformio==6.1.19

      - name: Bootstrap PlatformIO project packages
        run: "${RUNNER_TEMP}/platformio/bin/pio pkg install -e esp32-s3-devkitm-1"

      - name: Test Python tooling
        run: python -m unittest discover -s tests -v

      - name: Prepare release artifact
        run: |
          mkdir -p dist
          cp release-preview.md dist/release-preview.md

      - name: Build unprovisioned firmware
        if: steps.scope.outputs.firmware-build-required == 'true'
        env:
          AMBYTE_NVS_SKIP: "1"
          AMBYTE_PROJECT_VER: ${{ steps.preview.outputs.firmware-build-version }}
        run: "${RUNNER_TEMP}/platformio/bin/pio run -e esp32-s3-devkitm-1"

      - name: Verify version and create flash ZIP
        if: steps.scope.outputs.firmware-build-required == 'true'
        env:
          FIRMWARE_VERSION: ${{ steps.preview.outputs.firmware-build-version }}
          ZIP_NAME: ${{ steps.preview.outputs.zip-name }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/esp32-s3-devkitm-1"
          BUILD_FILES=(
            firmware.bin
            bootloader.bin
            partitions.bin
            ota_data_initial.bin
            flasher_args.json
          )
          for FILE in "${BUILD_FILES[@]}"; do
            test -f "${BUILD_DIR}/${FILE}"
          done
          test ! -f "${BUILD_DIR}/nvs.bin"

          "${RUNNER_TEMP}/platformio/bin/pio" pkg exec -p tool-esptoolpy -- \
            esptool.py image_info --version 2 "${BUILD_DIR}/firmware.bin" \
            | tee app-info.txt
          grep -F "App version: ${FIRMWARE_VERSION}" app-info.txt

          mkdir -p dist
          cp "${BUILD_DIR}/firmware.bin" dist/firmware.bin
          mkdir -p dist/bundle/bootloader dist/bundle/partition_table
          cp "${BUILD_DIR}/firmware.bin" dist/bundle/ambyte-iot.bin
          cp "${BUILD_DIR}/bootloader.bin" dist/bundle/bootloader/bootloader.bin
          cp "${BUILD_DIR}/partitions.bin" dist/bundle/partition_table/partition-table.bin
          cp "${BUILD_DIR}/ota_data_initial.bin" dist/bundle/ota_data_initial.bin
          cp "${BUILD_DIR}/flasher_args.json" dist/bundle/flasher_args.json
          (cd dist/bundle && zip -9 -r "../${ZIP_NAME}" .)
          rm -rf dist/bundle

      - name: Build schedule release candidate
        if: steps.preview.outputs.schedule-will-release == 'true'
        env:
          SCHEDULE_VERSION: ${{ steps.preview.outputs.schedule-version }}
          BUILT_AGAINST_FW: ${{ steps.preview.outputs.schedule-built-against-fw }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Icomponents/sched_spec/include \
            -Icomponents/time_sync/include -Itests/host_stubs \
            tools/sched_host.c components/sched_spec/*.c \
            components/time_sync/time_sync.c -lm -o "${RUNNER_TEMP}/sched_host"
          "${RUNNER_TEMP}/sched_host" --schema > dist/actions.schema.json
          SCHEDULES=(default legacy_1hz_spec)
          for SCRIPT in "${SCHEDULES[@]}"; do
            "${RUNNER_TEMP}/sched_host" --check "schedule/${SCRIPT}.yaml"
            {
              echo "### Simulated schedule/${SCRIPT}.yaml"
              echo '```text'
              "${RUNNER_TEMP}/sched_host" --simulate "schedule/${SCRIPT}.yaml" \
                --date 2026-06-21 --tz-offset-s 7200 --lat 52.173 --lon 5.819
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            python tools/build_schedule_release.py \
              --source "schedule/${SCRIPT}.yaml" \
              --asset-name "${SCRIPT}.yaml" \
              --output-dir dist \
              --version "${SCHEDULE_VERSION}" \
              --built-against-fw "${BUILT_AGAINST_FW}" \
              --repository "${REPOSITORY}"
            MANIFEST="dist/${SCRIPT}.yaml.manifest.json"
            test "$(jq -r .script_name "${MANIFEST}")" = "${SCRIPT}"
            test "$(jq -r .script_version "${MANIFEST}")" = "${SCHEDULE_VERSION}"
            test "$(jq -r .built_against_fw "${MANIFEST}")" = "${BUILT_AGAINST_FW}"
            test "$(sha256sum "dist/${SCRIPT}.yaml" | awk '{print $1}')" = \
              "$(jq -r .sha256 "${MANIFEST}")"
          done

      - name: Upload release candidate
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ github.event.pull_request.head.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
