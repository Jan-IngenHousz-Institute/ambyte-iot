name: Fleet command (ping / inventory / replay)

# Manually triggered device commands over the same fleet transport as the
# OTA workflow: a firmware check after a rollout (`ping` with expect_fw), an
# SD-archive survey (`inventory`) or the archive re-send (`replay`).
# Read-only by default; `replay` with mode run/cancel changes device state and
# goes through the same environment gate as an OTA. Results land in the run
# summary and in a results artifact.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target account/fleet"
        type: choice
        options: [dev, prod]
        default: dev
      command:
        description: "Command to send"
        type: choice
        options: [ping, inventory, replay]
        default: ping
      devices:
        description: "Exact client ids (ambyte_<MAC> or AMBYTE_<MAC>, case matters) or MACs, comma/space separated; empty = discover active devices"
        type: string
        default: ""
      discovery_window_minutes:
        description: "How far back to look for active devices when devices is empty"
        type: string
        default: "1440"
      expect_fw:
        description: "ping only: fail the run unless every reply reports this firmware (e.g. 2.3.1)"
        type: string
        default: ""
      mode:
        description: "replay only"
        type: choice
        options: [status, count, run, cancel]
        default: status
      token:
        description: "replay only: job token, [A-Za-z0-9._:-]{1,32}"
        type: string
        default: ""
      from_id:
        description: "inventory/replay: first measurement id (0 = none)"
        type: string
        default: "0"
      to_id:
        description: "inventory/replay: last measurement id (0 = none)"
        type: string
        default: "0"
      from_ms:
        description: "replay: capture-time lower bound, unix ms (0 = none)"
        type: string
        default: "0"
      to_ms:
        description: "replay: capture-time upper bound, unix ms (0 = none)"
        type: string
        default: "0"
      chunk:
        description: "replay run: records per chunk"
        type: string
        default: "64"
      wait_seconds:
        description: "How long to wait for replies"
        type: string
        default: "90"
      dry_run:
        description: "Print the plan and payload without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: fleet-deploy
  cancel-in-progress: false

jobs:
  command:
    name: ${{ inputs.command }} ${{ inputs.command == 'replay' && inputs.mode || '' }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: fleet-deploy-${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/fleet_deploy/requirements.txt

      - name: Install dependencies
        shell: bash
        run: pip install -r tools/fleet_deploy/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_FLEET_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fleet-command-${{ github.run_id }}

      - name: Run command
        id: run
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          DEVICES: ${{ inputs.devices }}
          WINDOW: ${{ inputs.discovery_window_minutes }}
          EXPECT_FW: ${{ inputs.expect_fw }}
          MODE: ${{ inputs.mode }}
          TOKEN: ${{ inputs.token }}
          FROM_ID: ${{ inputs.from_id }}
          TO_ID: ${{ inputs.to_id }}
          FROM_MS: ${{ inputs.from_ms }}
          TO_MS: ${{ inputs.to_ms }}
          CHUNK: ${{ inputs.chunk }}
          WAIT: ${{ inputs.wait_seconds }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -uo pipefail
          for v in WINDOW FROM_ID TO_ID FROM_MS TO_MS CHUNK WAIT; do
            [[ "${!v}" =~ ^[0-9]+$ ]] || { echo "::error::${v} must be a non-negative integer"; exit 2; }
          done
          ARGS=("${COMMAND}" --window-minutes "${WINDOW}" --wait "${WAIT}" --chunk "${CHUNK}"
                --from-id "${FROM_ID}" --to-id "${TO_ID}" --from-ms "${FROM_MS}" --to-ms "${TO_MS}"
                --results-json results.json)
          [[ -n "${DEVICES}" ]] && ARGS+=(--devices "${DEVICES}")
          [[ -n "${EXPECT_FW}" ]] && ARGS+=(--expect-fw "${EXPECT_FW}")
          [[ "${COMMAND}" == "replay" ]] && ARGS+=(--mode "${MODE}" --token "${TOKEN}")
          [[ "${DRY_RUN}" == "true" ]] && ARGS+=(--dry-run)
          set +e
          python tools/fleet_deploy/fleet_command.py "${ARGS[@]}" | tee command.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## Fleet command: ${COMMAND} ${MODE} on ${{ inputs.environment }}"
            echo
            echo '```'
            tail -n 80 command.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fleet-command-results-${{ github.run_id }}
          path: |
            results.json
            command.log
          if-no-files-found: ignore
