name: Fleet command (ping / inventory / replay)

# Manually triggered device commands over the same fleet transport as the
# OTA workflow: a firmware check after a rollout (`ping` with expect_fw), an
# SD-archive survey (`inventory`) or the archive re-send (`replay`).
# Read-only by default; `replay` with mode run/cancel changes device state and
# goes through the same environment gate as an OTA. Results land in the run
# summary and in a results artifact. `log-list` / `log-read` read the SD log
# directory (read-only, still behind the environment gate); log-read stitches
# one device's file into the artifact (device-log.txt). `power-protect` reads
# (status) or changes (clear / force, MUTATING, explicit devices only) the
# brownout protection state (docs/power-protect.md). `vin-limit` reads (get) or
# changes (set, MUTATING, explicit devices only) the charger's input voltage
# limit on firmware >= 2.21.0 (docs/charger-vin-limit.md). `iin-limit` does the
# same for the charger's input current limit register on firmware >= 2.23.0
# (docs/charger-iin-limit.md).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target account/fleet"
        type: choice
        options: [dev, prod]
        default: dev
      command:
        description: "Command to send"
        type: choice
        options: [ping, inventory, replay, get-timezone, set-timezone, log-list, log-read, power-protect, vin-limit, iin-limit]
        default: ping
      timezone:
        description: "set-timezone only: IANA timezone (e.g. Australia/Darwin); requires firmware with remote timezone support"
        type: string
        default: ""
      expect_offset:
        description: "Optional timezone verification: exact UTC offset in seconds (Darwin = 34200)"
        type: string
        default: ""
      log_name:
        description: "log-read only: file name from log-list (e.g. ambyte.log); needs exactly one device"
        type: string
        default: ""
      log_tail_bytes:
        description: "log-read only: read this many bytes from the end (0 = the whole file)"
        type: string
        default: "65536"
      power_protect_action:
        description: "power-protect only: status (read-only), clear or force (MUTATING; needs an explicit device list)"
        type: choice
        options: [status, clear, force]
        default: status
      power_protect_state:
        description: "power-protect force only: no_flash or hold (a forced state never auto-exits; clear ends it)"
        type: choice
        options: [no_flash, hold]
        default: no_flash
      vin_limit_action:
        description: "vin-limit only: get (read-only) or set (MUTATING; needs an explicit device list; firmware >= 2.21.0)"
        type: choice
        options: [get, set]
        default: get
      vin_limit_mv:
        description: "vin-limit set only: charger input voltage limit in mV, 3700-15200 in 100 mV steps (e.g. 4000)"
        type: string
        default: ""
      iin_limit_action:
        description: "iin-limit only: get (read-only) or set (MUTATING; needs an explicit device list; firmware >= 2.23.0)"
        type: choice
        options: [get, set]
        default: get
      iin_limit_ma:
        description: "iin-limit set only: charger input current limit register in mA, 100-3250 in 50 mA steps (e.g. 1000; default 500)"
        type: string
        default: ""
      devices:
        description: "Exact client ids (ambyte_<MAC> or AMBYTE_<MAC>, case matters) or MACs, comma/space separated; empty = discover active devices"
        type: string
        default: ""
      discovery_window_minutes:
        description: "How far back to look for active devices when devices is empty"
        type: string
        default: "1440"
      expect_fw:
        description: "ping only: fail the run unless every reply reports this firmware (e.g. 2.3.1)"
        type: string
        default: ""
      mode:
        description: "replay only"
        type: choice
        options: [status, count, run, cancel]
        default: status
      token:
        description: "replay only: job token, [A-Za-z0-9._:-]{1,32}"
        type: string
        default: ""
      from_id:
        description: "inventory/replay: first measurement id (0 = none)"
        type: string
        default: "0"
      to_id:
        description: "inventory/replay: last measurement id (0 = none)"
        type: string
        default: "0"
      from_ms:
        description: "replay: capture-time lower bound, unix ms (0 = none)"
        type: string
        default: "0"
      to_ms:
        description: "replay: capture-time upper bound, unix ms (0 = none)"
        type: string
        default: "0"
      chunk:
        description: "replay run: records per chunk"
        type: string
        default: "64"
      wait_seconds:
        description: "How long to wait for replies"
        type: string
        default: "90"
      dry_run:
        description: "Print the plan and payload without publishing"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: fleet-deploy
  cancel-in-progress: false

jobs:
  command:
    name: ${{ inputs.command }} ${{ inputs.command == 'replay' && inputs.mode || '' }} on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: fleet-deploy-${{ inputs.environment }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/fleet_deploy/requirements.txt

      - name: Install dependencies
        shell: bash
        run: pip install -r tools/fleet_deploy/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_FLEET_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: fleet-command-${{ github.run_id }}

      - name: Run command
        id: run
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          DEVICES: ${{ inputs.devices }}
          TIMEZONE: ${{ inputs.timezone }}
          EXPECT_OFFSET: ${{ inputs.expect_offset }}
          WINDOW: ${{ inputs.discovery_window_minutes }}
          EXPECT_FW: ${{ inputs.expect_fw }}
          MODE: ${{ inputs.mode }}
          TOKEN: ${{ inputs.token }}
          FROM_ID: ${{ inputs.from_id }}
          TO_ID: ${{ inputs.to_id }}
          FROM_MS: ${{ inputs.from_ms }}
          TO_MS: ${{ inputs.to_ms }}
          CHUNK: ${{ inputs.chunk }}
          WAIT: ${{ inputs.wait_seconds }}
          DRY_RUN: ${{ inputs.dry_run }}
          LOG_NAME: ${{ inputs.log_name }}
          LOG_TAIL: ${{ inputs.log_tail_bytes }}
          PP_ACTION: ${{ inputs.power_protect_action }}
          PP_STATE: ${{ inputs.power_protect_state }}
          VIN_ACTION: ${{ inputs.vin_limit_action }}
          VIN_MV: ${{ inputs.vin_limit_mv }}
          IIN_ACTION: ${{ inputs.iin_limit_action }}
          IIN_MA: ${{ inputs.iin_limit_ma }}
        run: |
          set -uo pipefail
          for v in WINDOW FROM_ID TO_ID FROM_MS TO_MS CHUNK WAIT LOG_TAIL; do
            [[ "${!v}" =~ ^[0-9]+$ ]] || { echo "::error::${v} must be a non-negative integer"; exit 2; }
          done
          if [[ "${COMMAND}" == "set-timezone" && -z "${DEVICES//[[:space:]]/}" ]]; then
            echo "::error::set-timezone requires an explicit device list; discovery is refused"
            exit 2
          fi
          if [[ "${COMMAND}" == "power-protect" && "${PP_ACTION}" != "status" && -z "${DEVICES//[[:space:]]/}" ]]; then
            echo "::error::power-protect ${PP_ACTION} requires an explicit device list; discovery is refused"
            exit 2
          fi
          if [[ "${COMMAND}" == "vin-limit" && "${VIN_ACTION:-get}" == "set" ]]; then
            if [[ -z "${DEVICES//[[:space:]]/}" ]]; then
              echo "::error::vin-limit set requires an explicit device list; discovery is refused"
              exit 2
            fi
            if [[ ! "${VIN_MV:-}" =~ ^[0-9]+$ ]]; then
              echo "::error::vin-limit set needs vin_limit_mv in whole millivolts (e.g. 4000)"
              exit 2
            fi
          fi
          if [[ "${COMMAND}" == "iin-limit" && "${IIN_ACTION:-get}" == "set" ]]; then
            if [[ -z "${DEVICES//[[:space:]]/}" ]]; then
              echo "::error::iin-limit set requires an explicit device list; discovery is refused"
              exit 2
            fi
            if [[ ! "${IIN_MA:-}" =~ ^[0-9]+$ ]]; then
              echo "::error::iin-limit set needs iin_limit_ma in whole milliamps (e.g. 1000)"
              exit 2
            fi
          fi
          if [[ -n "${EXPECT_OFFSET}" && ! "${EXPECT_OFFSET}" =~ ^-?[0-9]+$ ]]; then
            echo "::error::expect_offset must be integer seconds"
            exit 2
          fi
          ARGS=("${COMMAND}" --window-minutes "${WINDOW}" --wait "${WAIT}" --chunk "${CHUNK}"
                --from-id "${FROM_ID}" --to-id "${TO_ID}" --from-ms "${FROM_MS}" --to-ms "${TO_MS}"
                --results-json results.json)
          [[ -n "${DEVICES}" ]] && ARGS+=(--devices "${DEVICES}")
          [[ "${COMMAND}" == "set-timezone" ]] && ARGS+=(--timezone "${TIMEZONE}")
          [[ -n "${EXPECT_OFFSET}" ]] && ARGS+=(--expect-offset "${EXPECT_OFFSET}")
          [[ -n "${EXPECT_FW}" ]] && ARGS+=(--expect-fw "${EXPECT_FW}")
          [[ "${COMMAND}" == "replay" ]] && ARGS+=(--mode "${MODE}" --token "${TOKEN}")
          if [[ "${COMMAND}" == "power-protect" ]]; then
            ARGS+=(--action "${PP_ACTION}")
            [[ "${PP_ACTION}" == "force" ]] && ARGS+=(--state "${PP_STATE}")
          fi
          if [[ "${COMMAND}" == "vin-limit" ]]; then
            ARGS+=(--vin-action "${VIN_ACTION:-get}")
            [[ "${VIN_ACTION:-get}" == "set" ]] && ARGS+=(--mv "${VIN_MV}")
          fi
          if [[ "${COMMAND}" == "iin-limit" ]]; then
            ARGS+=(--iin-action "${IIN_ACTION:-get}")
            [[ "${IIN_ACTION:-get}" == "set" ]] && ARGS+=(--ma "${IIN_MA}")
          fi
          if [[ "${COMMAND}" == "log-read" ]]; then
            # fleet_command validates the name and refuses anything but one explicit device.
            ARGS+=(--name "${LOG_NAME}" --out device-log.txt)
            [[ "${LOG_TAIL}" != "0" ]] && ARGS+=(--tail "${LOG_TAIL}")
          fi
          [[ "${DRY_RUN}" == "true" ]] && ARGS+=(--dry-run)
          set +e
          python tools/fleet_deploy/fleet_command.py "${ARGS[@]}" | tee command.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "## Fleet command: ${COMMAND} ${MODE} on ${{ inputs.environment }}"
            echo
            echo '```'
            tail -n 80 command.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fleet-command-results-${{ github.run_id }}
          path: |
            results.json
            command.log
            device-log.txt
          if-no-files-found: ignore
