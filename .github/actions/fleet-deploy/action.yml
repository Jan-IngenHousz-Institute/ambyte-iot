name: Fleet deploy utility
description: Resolve, authenticate, target, run, and report an OTA or Lua fleet deployment

inputs:
  kind:
    description: Deployment kind (`ota` or `lua`)
    required: true
  repository:
    description: GitHub owner/repository containing release assets
    required: true
  release-tag:
    description: Exact release tag, or `latest` within the selected kind
    required: true
  version-op:
    description: Firmware-version predicate
    required: true
  version:
    description: Reference firmware version
    required: false
    default: ""
  percentage:
    description: Deterministic percentage of matching devices
    required: true
  devices:
    description: Optional exact device IDs or MACs
    required: false
    default: ""
  discovery-window-minutes:
    description: Active-device lookback window
    required: true
  dry-run:
    description: Preview without publishing the mutating update command
    required: true
  allow-downgrade:
    description: OTA only; permit targets newer than the selected firmware
    required: false
    default: "false"
  reboot:
    description: Lua only; reboot after a successful swap
    required: false
    default: "true"
  github-token:
    description: Token used to inspect published releases
    required: true
  aws-role-arn:
    description: Environment-scoped OIDC role for fleet access
    required: true

outputs:
  release-tag:
    description: Resolved immutable release tag
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Initialize result artifact
      env:
        KIND: ${{ inputs.kind }}
        REQUESTED_TAG: ${{ inputs.release-tag }}
        DRY_RUN: ${{ inputs.dry-run }}
      shell: bash
      run: |
        jq -n --arg kind "${KIND}" --arg tag "${REQUESTED_TAG}" \
          --argjson dry_run "${DRY_RUN}" \
          '{kind: $kind, requested_tag: $tag, dry_run: $dry_run, results: {}, error: "deployment did not start"}' \
          > results.json

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: tools/fleet_deploy/requirements.txt

    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
        KIND: ${{ inputs.kind }}
        TAG: ${{ inputs.release-tag }}
      shell: bash
      run: |
        set -euo pipefail
        case "${KIND}" in
          ota)
            REQUIRED_ASSETS=(firmware.bin)
            ;;
          lua)
            REQUIRED_ASSETS=(main.lua main.lua.manifest.json)
            ;;
          *)
            echo "::error::unknown fleet deployment kind: ${KIND}"
            exit 2
            ;;
        esac

        if [[ "${TAG}" == "latest" ]]; then
          RELEASES=$(gh release list --repo "${REPO}" --limit 1000 \
            --json tagName,isDraft,isPrerelease,publishedAt)
          TAG=$(python tools/fleet_deploy/release_selection.py --kind "${KIND}" \
            <<<"${RELEASES}")
        else
          python tools/fleet_deploy/release_selection.py --kind "${KIND}" \
            --tag "${TAG}" >/dev/null
        fi

        RELEASE=$(gh release view "${TAG}" --repo "${REPO}" --json isDraft,assets)
        jq -e '.isDraft == false' <<<"${RELEASE}" >/dev/null \
          || { echo "::error::release ${TAG} is still a draft"; exit 1; }
        ASSETS=$(jq -r '.assets[].name' <<<"${RELEASE}")
        for ASSET in "${REQUIRED_ASSETS[@]}"; do
          grep -Fqx "${ASSET}" <<<"${ASSETS}" \
            || { echo "::error::release ${TAG} has no ${ASSET} asset"; exit 1; }
        done
        echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
        echo "Deploying ${KIND} release ${TAG}" >> "${GITHUB_STEP_SUMMARY}"

    - name: Install dependencies
      shell: bash
      run: pip install --disable-pip-version-check -r tools/fleet_deploy/requirements.txt

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: eu-central-1
        role-session-name: fleet-deploy-${{ inputs.kind }}-${{ github.run_id }}
        # Jitter plus a degraded download can exceed the default one-hour
        # credential lifetime; both environment roles allow two-hour sessions.
        role-duration-seconds: 7200

    - name: Run targeted fleet deploy
      env:
        KIND: ${{ inputs.kind }}
        REPO: ${{ inputs.repository }}
        TAG: ${{ steps.release.outputs.tag }}
        VERSION_OP: ${{ inputs.version-op }}
        VERSION: ${{ inputs.version }}
        PERCENTAGE: ${{ inputs.percentage }}
        DEVICES: ${{ inputs.devices }}
        WINDOW_MINUTES: ${{ inputs.discovery-window-minutes }}
        DRY_RUN: ${{ inputs.dry-run }}
        ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        REBOOT: ${{ inputs.reboot }}
      shell: bash
      run: |
        set -euo pipefail
        ARGS=(
          --repo "${REPO}"
          --tag "${TAG}"
          --version-op "${VERSION_OP}"
          --percentage "${PERCENTAGE}"
          --window-minutes "${WINDOW_MINUTES}"
          --results-json results.json
        )
        [[ -n "${VERSION}" ]] && ARGS+=(--version "${VERSION}")
        [[ -n "${DEVICES}" ]] && ARGS+=(--devices "${DEVICES}")
        case "${DRY_RUN}" in
          true) ARGS+=(--dry-run) ;;
          false) ;;
          *) echo "::error::dry-run must be true or false"; exit 2 ;;
        esac

        case "${KIND}" in
          ota)
            [[ "${ALLOW_DOWNGRADE}" == "true" ]] && ARGS+=(--allow-downgrade)
            python tools/fleet_deploy/fleet_deploy.py "${ARGS[@]}"
            ;;
          lua)
            [[ "${REBOOT}" == "true" ]] && ARGS+=(--reboot) || ARGS+=(--no-reboot)
            python tools/fleet_deploy/lua_deploy.py "${ARGS[@]}"
            ;;
        esac

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: fleet-deploy-${{ inputs.kind }}-results-${{ github.run_id }}
        path: results.json
        if-no-files-found: warn
        retention-days: 90
