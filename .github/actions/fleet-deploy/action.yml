name: Fleet deploy utility
description: Resolve, authenticate, target, run, and report an OTA, Lua, or AMBIT fleet deployment

inputs:
  kind:
    description: Deployment kind (`ota`, `lua`, or `ambit`)
    required: true
  repository:
    description: GitHub owner/repository containing release assets
    required: true
  release-tag:
    description: Exact release tag, or `latest` within the selected kind
    required: true
  script-name:
    description: Lua only; released asset name without the .lua suffix
    required: false
    default: main
  version-op:
    description: Firmware-version predicate
    required: true
  version:
    description: Reference firmware version
    required: false
    default: ""
  percentage:
    description: Deterministic percentage of matching devices
    required: true
  devices:
    description: Optional exact device IDs or MACs
    required: false
    default: ""
  discovery-window-minutes:
    description: Active-device lookback window
    required: true
  dry-run:
    description: Preview without publishing the mutating update command
    required: true
  allow-downgrade:
    description: OTA/AMBIT; permit targets newer than the selected firmware
    required: false
    default: "false"
  allow-prerelease:
    description: AMBIT only; permit an explicitly selected prerelease tag
    required: false
    default: "false"
  force-reflash:
    description: AMBIT only; reapply an already-current numeric version (explicit devices only)
    required: false
    default: "false"
  ambit-final-seconds:
    description: AMBIT only; terminal observation budget including jitter and four-channel streaming
    required: false
    default: "3600"
  reboot:
    description: Lua only; reboot after a successful swap
    required: false
    default: "true"
  github-token:
    description: Token used to inspect published releases
    required: true
  aws-role-arn:
    description: Environment-scoped OIDC role for fleet access
    required: true

outputs:
  release-tag:
    description: Resolved immutable release tag
    value: ${{ steps.release.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Initialize result artifact
      env:
        KIND: ${{ inputs.kind }}
        REQUESTED_TAG: ${{ inputs.release-tag }}
        DRY_RUN: ${{ inputs.dry-run }}
      shell: bash
      run: |
        jq -n --arg kind "${KIND}" --arg tag "${REQUESTED_TAG}" \
          --argjson dry_run "${DRY_RUN}" \
          '{kind: $kind, requested_tag: $tag, dry_run: $dry_run, results: {}, error: "deployment did not start"}' \
          > results.json

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: tools/fleet_deploy/requirements.txt

    - name: Resolve release tag
      id: release
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
        KIND: ${{ inputs.kind }}
        TAG: ${{ inputs.release-tag }}
        ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
        SCRIPT_NAME: ${{ inputs.script-name }}
      shell: bash
      run: |
        set -euo pipefail
        case "${KIND}" in
          ota)
            REQUIRED_ASSETS=(firmware.bin)
            ;;
          lua)
            [[ "${SCRIPT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]] \
              || { echo "::error::invalid Lua script name: ${SCRIPT_NAME}"; exit 2; }
            REQUIRED_ASSETS=("${SCRIPT_NAME}.lua" "${SCRIPT_NAME}.lua.manifest.json")
            ;;
          ambit)
            REQUIRED_ASSETS=(manifest.json)
            ;;
          *)
            echo "::error::unknown fleet deployment kind: ${KIND}"
            exit 2
            ;;
        esac

        if [[ "${TAG}" == "latest" ]]; then
          RELEASES=$(gh release list --repo "${REPO}" --limit 1000 \
            --json tagName,isDraft,isPrerelease,publishedAt)
          TAG=$(python tools/fleet_deploy/release_selection.py --kind "${KIND}" \
            <<<"${RELEASES}")
        else
          python tools/fleet_deploy/release_selection.py --kind "${KIND}" \
            --tag "${TAG}" >/dev/null
        fi

        RELEASE=$(gh api -H "X-GitHub-Api-Version: 2022-11-28" \
          "/repos/${REPO}/releases/tags/${TAG}")
        jq -e '.draft == false and .published_at != null' <<<"${RELEASE}" >/dev/null \
          || { echo "::error::release ${TAG} is not published"; exit 1; }
        if [[ "${KIND}" == "ambit" ]]; then
          gh api -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${REPO}" --jq '.private == false' | grep -Fx true >/dev/null \
            || { echo "::error::AMBIT release repository is not public"; exit 1; }
          jq -e '.immutable == true' <<<"${RELEASE}" >/dev/null \
            || { echo "::error::AMBIT release ${TAG} is not immutable"; exit 1; }
          case "${ALLOW_PRERELEASE}" in
            true) ;;
            false)
              jq -e '.prerelease == false' <<<"${RELEASE}" >/dev/null \
                || { echo "::error::AMBIT prerelease requires explicit opt-in"; exit 1; }
              ;;
            *) echo "::error::allow-prerelease must be true or false"; exit 2 ;;
          esac
        fi
        ASSETS=$(jq -r '.assets[].name' <<<"${RELEASE}")
        for ASSET in "${REQUIRED_ASSETS[@]}"; do
          grep -Fqx "${ASSET}" <<<"${ASSETS}" \
            || { echo "::error::release ${TAG} has no ${ASSET} asset"; exit 1; }
        done
        echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
        echo "Deploying ${KIND} release ${TAG}" >> "${GITHUB_STEP_SUMMARY}"

    - name: Install dependencies
      shell: bash
      run: pip install --disable-pip-version-check -r tools/fleet_deploy/requirements.txt

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: eu-central-1
        role-session-name: fleet-deploy-${{ inputs.kind }}-${{ github.run_id }}
        # Jitter plus a degraded download can exceed the default one-hour
        # credential lifetime; both environment roles allow two-hour sessions.
        role-duration-seconds: 7200

    - name: Run targeted fleet deploy
      env:
        KIND: ${{ inputs.kind }}
        REPO: ${{ inputs.repository }}
        TAG: ${{ steps.release.outputs.tag }}
        VERSION_OP: ${{ inputs.version-op }}
        VERSION: ${{ inputs.version }}
        PERCENTAGE: ${{ inputs.percentage }}
        DEVICES: ${{ inputs.devices }}
        WINDOW_MINUTES: ${{ inputs.discovery-window-minutes }}
        DRY_RUN: ${{ inputs.dry-run }}
        ALLOW_DOWNGRADE: ${{ inputs.allow-downgrade }}
        ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
        FORCE_REFLASH: ${{ inputs.force-reflash }}
        AMBIT_FINAL_SECONDS: ${{ inputs.ambit-final-seconds }}
        REBOOT: ${{ inputs.reboot }}
        SCRIPT_NAME: ${{ inputs.script-name }}
      shell: bash
      run: |
        set -euo pipefail
        ARGS=(
          --repo "${REPO}"
          --tag "${TAG}"
          --version-op "${VERSION_OP}"
          --percentage "${PERCENTAGE}"
          --window-minutes "${WINDOW_MINUTES}"
          --results-json results.json
        )
        [[ -n "${VERSION}" ]] && ARGS+=(--version "${VERSION}")
        [[ -n "${DEVICES}" ]] && ARGS+=(--devices "${DEVICES}")
        case "${DRY_RUN}" in
          true) ARGS+=(--dry-run) ;;
          false) ;;
          *) echo "::error::dry-run must be true or false"; exit 2 ;;
        esac

        case "${KIND}" in
          ota)
            [[ "${ALLOW_DOWNGRADE}" == "true" ]] && ARGS+=(--allow-downgrade)
            python tools/fleet_deploy/fleet_deploy.py "${ARGS[@]}"
            ;;
          lua)
            [[ "${REBOOT}" == "true" ]] && ARGS+=(--reboot) || ARGS+=(--no-reboot)
            ARGS+=(--script-name "${SCRIPT_NAME}")
            python tools/fleet_deploy/lua_deploy.py "${ARGS[@]}"
            ;;
          ambit)
            [[ "${ALLOW_DOWNGRADE}" == "true" ]] && ARGS+=(--allow-downgrade)
            [[ "${ALLOW_PRERELEASE}" == "true" ]] && ARGS+=(--allow-prerelease)
            [[ "${FORCE_REFLASH}" == "true" ]] && ARGS+=(--force-reflash)
            ARGS+=(--final-seconds "${AMBIT_FINAL_SECONDS}")
            python tools/fleet_deploy/ambit_deploy.py "${ARGS[@]}"
            ;;
        esac

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: fleet-deploy-${{ inputs.kind }}-results-${{ github.run_id }}
        path: results.json
        if-no-files-found: warn
        retention-days: 90
